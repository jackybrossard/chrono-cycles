<title>Chrono cycles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEF2; --surface:#F7F9FB; --ink:#152238; --muted:#5C6B80; --line:#C9D3DD;
  --work:#1F4FD8; --rest:#E8A317; --done:#2E8B57;
  --phase:var(--work);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1724; --surface:#18233A; --ink:#E6ECF5; --muted:#93A2B8; --line:#2C3A55;
    --work:#5B86FF; --rest:#F2B53A; --done:#4CC384;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1724; --surface:#18233A; --ink:#E6ECF5; --muted:#93A2B8; --line:#2C3A55;
  --work:#5B86FF; --rest:#F2B53A; --done:#4CC384;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);-webkit-tap-highlight-color:transparent}
main{max-width:440px;margin:0 auto;padding:12px 18px 16px;display:flex;flex-direction:column;gap:14px}

header{display:flex;justify-content:space-between;align-items:baseline}
h1{margin:0;font-size:1.35rem;font-weight:700;font-stretch:88%;letter-spacing:-.01em}
.cycle-count{font-size:1rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* Cadran */
.dial{position:relative;width:min(68vw,36vh,300px);aspect-ratio:1;margin:0 auto}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.track{fill:none;stroke:var(--line);stroke-width:10}
.arc{fill:none;stroke:var(--phase);stroke-width:10;stroke-linecap:round;transition:stroke .3s}
.dial-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.time{font-size:clamp(3.4rem,min(17vw,9vh),5.6rem);font-weight:800;font-stretch:62%;line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.phase-name{font-size:1.05rem;font-weight:600;color:var(--phase);transition:color .3s}
.next{font-size:.85rem;color:var(--muted);min-height:1.2em}

/* Réglages */
.settings{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:2px 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0}
.row + .row{border-top:1px solid var(--line)}
.row label{font-size:.95rem;font-weight:500}
.row small{display:block;color:var(--muted);font-size:.8rem;font-weight:400}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:1.3rem;font-family:inherit;cursor:pointer;line-height:1}
.stepper button:active{background:var(--line)}
.stepper input{width:64px;text-align:center;font:inherit;font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;background:transparent;border:none;color:var(--ink);padding:4px 0;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:15px;background:var(--line);transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked + span{background:var(--work)}
.switch input:checked + span::after{transform:translateX(22px)}
.settings.locked{opacity:.45;pointer-events:none}
.total{font-size:.85rem;color:var(--muted);text-align:center;margin:-6px 0 0}

/* Commandes */
.controls{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.controls button{height:54px;border-radius:27px;font:inherit;font-size:1.1rem;font-weight:700;cursor:pointer;border:none}
#main-btn{background:var(--phase);color:#fff;transition:background .3s}
#reset-btn{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
#reset-btn:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--work);outline-offset:2px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Chrono cycles</h1>
    <span class="cycle-count" id="cycle-count" aria-live="polite"></span>
  </header>

  <div class="dial" role="timer" aria-live="off">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle class="track" cx="60" cy="60" r="52"/>
      <circle class="arc" id="arc" cx="60" cy="60" r="52"/>
    </svg>
    <div class="dial-center">
      <div class="time" id="time">0:30</div>
      <div class="phase-name" id="phase-name">Prêt</div>
      <div class="next" id="next"></div>
    </div>
  </div>

  <div class="controls">
    <button type="button" id="reset-btn" disabled>Réinitialiser</button>
    <button type="button" id="main-btn">Démarrer</button>
  </div>
  <p class="total" id="total"></p>

  <section class="settings" id="settings" aria-label="Réglages">
    <div class="row">
      <label for="cycles">Nombre de cycles</label>
      <div class="stepper">
        <button type="button" data-target="cycles" data-step="-1" aria-label="Moins de cycles">−</button>
        <input id="cycles" type="number" inputmode="numeric" min="1" max="999" value="5">
        <button type="button" data-target="cycles" data-step="1" aria-label="Plus de cycles">+</button>
      </div>
    </div>
    <div class="row">
      <label for="work">Durée du cycle<small>en secondes</small></label>
      <div class="stepper">
        <button type="button" data-target="work" data-step="-1" aria-label="Moins 1 seconde">−</button>
        <input id="work" type="number" inputmode="numeric" min="1" max="36000" value="30">
        <button type="button" data-target="work" data-step="1" aria-label="Plus 1 seconde">+</button>
      </div>
    </div>
    <div class="row">
      <label for="rest">Attente entre les cycles<small>en secondes, 0 = enchaîné</small></label>
      <div class="stepper">
        <button type="button" data-target="rest" data-step="-1" aria-label="Moins 1 seconde">−</button>
        <input id="rest" type="number" inputmode="numeric" min="0" max="36000" value="10">
        <button type="button" data-target="rest" data-step="1" aria-label="Plus 1 seconde">+</button>
      </div>
    </div>
    <div class="row">
      <label for="restfirst">Commencer par l'attente<small>avant le 1er cycle</small></label>
      <div class="switch"><input id="restfirst" type="checkbox" checked><span></span></div>
    </div>
    <div class="row">
      <label for="countdown">Petits bips 3‑2‑1<small>avant chaque bip principal</small></label>
      <div class="switch"><input id="countdown" type="checkbox"><span></span></div>
    </div>
  </section>

</main>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const els = {
    cycles:$('cycles'), work:$('work'), rest:$('rest'), countdown:$('countdown'), restfirst:$('restfirst'),
    time:$('time'), phase:$('phase-name'), next:$('next'), count:$('cycle-count'),
    arc:$('arc'), main:$('main-btn'), reset:$('reset-btn'), settings:$('settings'), total:$('total')
  };
  const CIRC = 2*Math.PI*52;
  els.arc.style.strokeDasharray = CIRC;

  /* ---------- Réglages mémorisés ---------- */
  const KEY = 'chrono-cycles-settings';
  try{
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if(s){ els.cycles.value=s.cycles; els.work.value=s.work; els.rest.value=s.rest; els.countdown.checked=!!s.countdown; if('restfirst' in s) els.restfirst.checked=!!s.restfirst; }
  }catch(e){}
  function saveSettings(){
    try{ localStorage.setItem(KEY, JSON.stringify(read())); }catch(e){}
  }
  function clampInput(inp){
    const min=+inp.min, max=+inp.max;
    let v = Math.round(+inp.value);
    if(!isFinite(v)) v=min;
    inp.value = Math.min(max, Math.max(min, v));
  }
  function read(){
    return { cycles:+els.cycles.value, work:+els.work.value, rest:+els.rest.value, countdown:els.countdown.checked, restfirst:els.restfirst.checked };
  }
  document.querySelectorAll('.stepper button').forEach(b=>{
    const inp = $(b.dataset.target);
    const stepBy = n => { inp.value = (+inp.value||0) + n; clampInput(inp); onSettingsChange(); };
    let holdT=null, repT=null, count=0;
    const stop = ()=>{ clearTimeout(holdT); clearTimeout(repT); holdT=repT=null; };
    b.addEventListener('pointerdown', e=>{
      e.preventDefault();
      stop(); count=0;
      stepBy(+b.dataset.step);
      holdT = setTimeout(function rep(){
        count++;
        // accélère : 1 par 1, puis 5 par 5 après ~2 s d'appui
        const mult = count>20 ? 5 : 1;
        stepBy(+b.dataset.step*mult);
        repT = setTimeout(rep, count>8 ? 60 : 120);
      }, 450);
    });
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
    b.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); stepBy(+b.dataset.step); } });
    b.addEventListener('contextmenu', e=>e.preventDefault());
  });
  [els.cycles,els.work,els.rest].forEach(i=>i.addEventListener('change',()=>{clampInput(i);onSettingsChange();}));
  els.countdown.addEventListener('change',saveSettings);
  els.restfirst.addEventListener('change',onSettingsChange);
  function onSettingsChange(){ saveSettings(); if(state==='idle'||state==='done') showIdle(); }

  /* ---------- Son ---------- */
  let ctx = null;
  function initAudio(){
    try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
    if(!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      ctx = new AC();
      // déverrouillage iOS
      const b = ctx.createBuffer(1,1,22050), s = ctx.createBufferSource();
      s.buffer=b; s.connect(ctx.destination); s.start(0);
    }
    if(ctx.state==='suspended') ctx.resume();
  }
  function tone(freq, dur, when=0, vol=0.5){
    if(!ctx) return;
    const t = ctx.currentTime + when;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.01);
    g.gain.setValueAtTime(vol,t+dur-0.04);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t+dur+0.02);
  }
  const beep = {
    start(){ tone(1320,0.35,0,0.6); },                       // aigu : départ d'un cycle
    end(){ tone(880,0.22,0,0.6); tone(880,0.22,0.3,0.6); },  // double : fin d'un cycle
    tick(){ tone(1000,0.07,0,0.25); },                       // compte à rebours
    finish(){ [0,0.25,0.5].forEach((w,i)=>tone(880+i*220,0.22,w,0.6)); tone(1760,0.6,0.75,0.6); }
  };

  /* ---------- Écran allumé ---------- */
  let wakeLock=null;
  async function keepAwake(on){
    try{
      if(on && 'wakeLock' in navigator && !wakeLock){
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release',()=>{wakeLock=null;});
      } else if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; }
    }catch(e){}
  }
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible' && state==='running') keepAwake(true);
  });

  /* ---------- Moteur ---------- */
  // state : idle | running | paused | done ; phase : work | rest
  let state='idle', phase='work', cycle=1, cfg=null;
  let phaseStart=0, phaseDur=0, pausedAt=0, lastTick=null, timer=null;

  function now(){ return performance.now(); }

  function beginPhase(p, startTime){
    phase=p; phaseStart=startTime;
    phaseDur = (p==='work'?cfg.work:cfg.rest)*1000;
    lastTick=null;
    document.documentElement.style.setProperty('--phase', p==='work'?'var(--work)':'var(--rest)');
  }

  function start(){
    initAudio();
    cfg = read();
    if(cfg.restfirst && cfg.rest>0){ cycle=0; beginPhase('rest', now()); }
    else { cycle=1; beginPhase('work', now()); beep.start(); }
    state='running';
    loop(); keepAwake(true); render();
  }

  function advance(){
    const t = phaseStart + phaseDur; // garde l'excédent pour ne pas dériver
    if(phase==='work'){
      if(cycle>=cfg.cycles){ finish(); return; }
      if(cfg.rest>0){ beep.end(); beginPhase('rest', t); }
      else { cycle++; beep.start(); beginPhase('work', t); }
    } else {
      cycle++; beep.start(); beginPhase('work', t);
    }
  }

  function finish(){
    beep.finish();
    state='done'; stopLoop(); keepAwake(false);
    document.documentElement.style.setProperty('--phase','var(--done)');
    render();
  }

  function loop(){
    stopLoop();
    timer = setInterval(step, 50);
    const raf = ()=>{ if(state==='running'){ render(); requestAnimationFrame(raf);} };
    requestAnimationFrame(raf);
  }
  function stopLoop(){ if(timer){ clearInterval(timer); timer=null; } }

  function step(){
    if(state!=='running') return;
    let guard=0;
    while(state==='running' && now()-phaseStart >= phaseDur && guard++<1000) advance();
    if(state!=='running') return;
    if(cfg.countdown){
      const remain = Math.ceil((phaseDur-(now()-phaseStart))/1000);
      if(remain<=3 && remain>=1 && remain!==lastTick && phaseDur>=4000){ lastTick=remain; beep.tick(); }
    }
  }

  function pause(){ state='paused'; pausedAt=now(); stopLoop(); keepAwake(false); render(); }
  function resume(){ initAudio(); phaseStart += now()-pausedAt; state='running'; loop(); keepAwake(true); render(); }
  function reset(){ state='idle'; stopLoop(); keepAwake(false); showIdle(); }

  /* ---------- Affichage ---------- */
  function fmt(sec){
    const s=Math.max(0,Math.ceil(sec));
    const m=Math.floor(s/60), r=s%60;
    return m>0 ? m+':'+String(r).padStart(2,'0') : String(r);
  }
  function fmtTotal(sec){
    const m=Math.floor(sec/60), s=sec%60;
    return (m? m+' min ':'') + (s||!m ? s+' s':'');
  }
  function setArc(frac){ els.arc.style.strokeDashoffset = CIRC*(1-Math.min(1,Math.max(0,frac))); }

  function showIdle(){
    const c=read();
    document.documentElement.style.setProperty('--phase','var(--work)');
    els.time.textContent=fmt(c.work);
    els.phase.textContent='Prêt';
    els.next.textContent='';
    els.count.textContent=c.cycles+' cycle'+(c.cycles>1?'s':'');
    els.total.textContent='Durée totale : '+fmtTotal(c.cycles*c.work + (c.cycles-1+(c.restfirst?1:0))*c.rest);
    setArc(1);
    els.main.textContent='Démarrer';
    els.reset.disabled=true;
    els.settings.classList.remove('locked');
  }

  function render(){
    if(state==='idle') return showIdle();
    els.settings.classList.add('locked');
    els.reset.disabled=false;
    els.count.textContent= cycle===0 ? 'Départ' : 'Cycle '+cycle+' / '+cfg.cycles;
    if(state==='done'){
      els.time.textContent='0';
      els.phase.textContent='Terminé';
      els.next.textContent=cfg.cycles+' cycle'+(cfg.cycles>1?'s':'')+' effectué'+(cfg.cycles>1?'s':'');
      setArc(1);
      els.main.textContent='Recommencer';
      return;
    }
    const elapsed = (state==='paused'?pausedAt:now()) - phaseStart;
    const remain = (phaseDur-elapsed)/1000;
    els.time.textContent = fmt(remain);
    setArc(1 - elapsed/phaseDur);
    if(phase==='work'){
      els.phase.textContent = state==='paused' ? 'En pause' : 'Cycle en cours';
      els.next.textContent = cycle<cfg.cycles ? (cfg.rest>0 ? 'Puis '+cfg.rest+' s d\'attente' : 'Puis cycle suivant') : 'Dernier cycle';
    } else {
      els.phase.textContent = state==='paused' ? 'En pause' : (cycle===0 ? 'Préparation' : 'Attente');
      els.next.textContent = 'Prochain : cycle '+(cycle+1);
    }
    els.main.textContent = state==='paused' ? 'Reprendre' : 'Pause';
  }

  els.main.addEventListener('click',()=>{
    if(state==='idle') start();
    else if(state==='running') pause();
    else if(state==='paused') resume();
    else if(state==='done'){ start(); }
  });
  els.reset.addEventListener('click',reset);

  showIdle();
})();
</script>
</body>
</html>
